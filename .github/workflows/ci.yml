name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancel an in-flight run when a newer commit is pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, detekt & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Handles Gradle dependency/build caching automatically.
      # On PRs the cache is read-only (only the default branch writes it) — the secure default.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `check` aggregates Spotless/ktlint + detekt + unit tests (incl. commonTest, which
      # runs on the JVM under testDebugUnitTest) + Android lint. No emulator needed.
      - name: Run checks
        run: ./gradlew check --stacktrace

      # Keep reports even when the build fails, so you can open the HTML locally.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
